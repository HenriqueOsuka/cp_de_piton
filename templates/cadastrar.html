{% extends "base.html" %}
{% block content %}
<h2>Cadastrar Novo Evento</h2>
{% if erro %}<p class="error">{{ erro }}</p>{% endif %}
<form method="POST">
    <label>ID do Evento:</label>
    <input type="number" name="id_evento" required>

    <label>Nome do Evento:</label>
    <input type="text" name="nome_evento" required>

    <label>Categoria:</label>
    <input type="text" name="categoria" required>

    <label>Data do Evento:</label>
    <input type="date" name="data_evento" required>

    <label>Local:</label>
    <input type="text" name="local_evento" required>

    <label>Capacidade:</label>
    <input type="number" name="capacidade" min ="1" required>

    <label>Valor do Ingresso (R$):</label>
    <input type="number" step="0.01" min="0" name="valor_ingresso" value="0.00">

    <label>Responsável:</label>
    <input type="text" name="responsavel" required>

    <label>Status:</label>
    <select name="status">
        <option value="ATIVO">Ativo</option>
        <option value="CANCELADO">Cancelado</option>
    </select>

    <button type="submit">Salvar Evento</button>
</form>
{% endblock %}
