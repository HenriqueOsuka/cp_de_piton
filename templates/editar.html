{% extends "base.html" %}
{% block content %}
<h2>Editar Evento</h2>
{% if erro %}<p class="error">{{ erro }}</p>{% endif %}
<form method="POST">
    <label>Nome do Evento:</label>
    <input type="text" name="nome_evento" value="{{ evento.nome_evento }}" required>

    <label>Categoria:</label>
    <input type="text" name="categoria" value="{{ evento.categoria }}" required>

    <label>Data do Evento:</label>
    <input type="date" name="data_evento" value="{{ evento.data_evento }}" required>

    <label>Local:</label>
    <input type="text" name="local_evento" value="{{ evento.local_evento }}" required>

    <label>Capacidade:</label>
    <input type="number" min="1" name="capacidade" value="{{ evento.capacidade }}" required>

    <label>Valor do Ingresso (R$):</label>
    <input type="number" step="0.01" name="valor_ingresso" value="{{ evento.valor_ingresso or 0 }}" min="0">

    <label>Responsável:</label>
    <input type="text" name="responsavel" value="{{ evento.responsavel }}" required>

    <label>Status:</label>
    <select name="status">
        <option value="ATIVO" {% if evento.status=='ATIVO' %}selected{% endif %}>Ativo</option>
        <option value="CANCELADO" {% if evento.status=='CANCELADO' %}selected{% endif %}>Cancelado</option>
    </select>

    <button type="submit">Atualizar Evento</button>
</form>
{% endblock %}
